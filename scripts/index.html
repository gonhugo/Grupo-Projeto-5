<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registo - HS Hotels</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <style>
        .campo-grupo {
            margin-bottom: 15px;
            text-align: left;
        }
        .campo-grupo label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .campo-grupo input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .btn-alternar {
            background: none;
            border: none;
            display: block;
            margin: 15px auto 0 auto;
            color: #ff1e00;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-alternar:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container-pagamento" style="max-width: 450px; margin-top: 60px; text-align: center; margin-left: auto; margin-right: auto; padding: 20px; border: 1px solid #eee; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    <div class="header-pagamento">
        <img src="../images/logotipo.jpg" alt="Logótipo HS Hotels" style="max-width: 180px; margin-bottom: 15px;">
    </div>

    <div id="seccao-login" style="display: block;">
        <h2 style="margin-bottom: 20px;">Iniciar Sessão</h2>
        <form onsubmit="efetuarLogin(event)">
            <div class="campo-grupo">
                <label>Email ou Utilizador:</label>
                <input type="text" id="login-email" required placeholder="Insira o seu email">
            </div>
            <div class="campo-grupo">
                <label>Palavra-passe (Password):</label>
                <input type="password" id="login-pass" required placeholder="Insira a sua password">
            </div>
            <button type="submit" class="btn-ver" style="border: none; cursor: pointer; padding: 12px; width: 100%; background-color: #333; color: white; border-radius: 4px; font-weight: bold;">Entrar</button>
        </form>
        <button type="button" class="btn-alternar" onclick="mostrarRegisto()">Não tem conta? Registe-se aqui</button>
    </div>

    <div id="seccao-registo" style="display: none;">
        <h2 style="margin-bottom: 20px;">Criar Nova Conta</h2>
        
        <form action="novoregistro.php" method="POST">
            <div class="campo-grupo">
                <label>Nome Completo:</label>
                <input type="text" name="nome_completo" required placeholder="Insira o seu nome">
            </div>
            <div class="campo-grupo">
                <label>Email:</label>
                <input type="email" name="email_utilizador" required placeholder="Insira o seu email">
            </div>
            <div class="campo-grupo">
                <label>Palavra-passe (Password):</label>
                <input type="password" name="password_utilizador" required placeholder="Crie uma password">
            </div>
            <button type="submit" class="btn-ver" style="border: none; cursor: pointer; padding: 12px; width: 100%; background-color: #333; color: white; border-radius: 4px; font-weight: bold;">Registar e Entrar</button>
        </form>
        <button type="button" class="btn-alternar" onclick="mostrarLogin()">Já tem conta? Faça Login</button>
    </div>
</div>

<script>
    function mostrarRegisto() {
        document.getElementById('seccao-login').style.display = 'none';
        document.getElementById('seccao-registo').style.display = 'block';
    }

    function mostrarLogin() {
        document.getElementById('seccao-registo').style.display = 'none';
        document.getElementById('seccao-login').style.display = 'block';
    }

    function efetuarLogin(event) {
        event.preventDefault();
        var email = document.getElementById('login-email').value;

        if (email.toLowerCase() === 'admin' || email.toLowerCase() === 'admin@email.com') {
            alert('Bem-vindo, Administrador!');
            window.location.href = 'administrador.php';
        } else {
            alert('Login efetuado com sucesso!');
            window.location.href = 'catalogo.php';
        }
    }
</script>

</body>
</html>
