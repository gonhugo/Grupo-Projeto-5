<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Ofertas - HS Hotels</title>
    <!-- Leitura da pasta styles/styles.css -->
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>

<header>
    <div class="logo-container">
        <img src="../images/logotipo.jpg" alt="Logótipo HS Hotels">
    </div>
    <h2>Catálogo de Hotéis</h2>
    <div class="nav-links">
        <a href="administrador.html">Painel Admin</a>
        <a href="agentemarketing.html">Painel Marketing</a>
    </div>
</header>

<div class="grid-catalogo" id="espaco-cards"></div>

<script>
    function renderizarCatalogo() {
        var ofertas = JSON.parse(localStorage.getItem('ofertas')) || [];
        var htmlEspaco = document.getElementById('espaco-cards');
        if (!htmlEspaco) return;
        htmlEspaco.innerHTML = '';

        if (ofertas.length === 0) {
            htmlEspaco.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #777;">Nenhuma oferta disponível de momento.</p>';
            return;
        }

        ofertas.forEach(function(o) {
            var htmlPrecos = '';
            if (o.precoAntigo && o.precoAntigo !== o.precoNovo) {
                htmlPrecos += '<span class="preco-antes">Antes: ' + o.precoAntigo + '€</span>';
            }
            htmlPrecos += '<span class="preco-agora">' + o.precoNovo + '€</span>';

            htmlEspaco.innerHTML += `
                <div class="card-hotel">
                    <div>
                        <h3>${o.nome}</h3>
                        <p>${o.descricao || 'Sem descrição disponível.'}</p>
                    </div>
                    <div>
                        <div class="box-precos">${htmlPrecos}</div>
                        <a href="pagamento.html?id=${o.id}" class="btn-ver">Ver Oferta</a>
                    </div>
                </div>`;
        });
    }
    window.onload = function() { renderizarCatalogo(); };
</script>
</body>
</html>
