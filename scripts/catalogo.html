<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Ofertas - HS Hotels</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>

<header>
    <div class="logo-container">
        <img src="../images/logotipo.jpg" alt="Logótipo HS Hotels">
    </div>
    <h2>Catálogo de Hotéis</h2>
    <div class="nav-links">
        <a href="administrador.html">Painel Admin</a>
        <a href="agentemarketing.html">Painel Marketing</a>
    </div>
</header>

<div class="grid-catalogo" id="espaco-cards"></div>

<script>
    function verificarBancoDeDados() {
        var ofertasAtuais = localStorage.getItem('ofertas');
        // Se não houver ofertas ou estiver vazio, cria as ofertas iniciais já com o caminho das imagens
        if (!ofertasAtuais || ofertasAtuais === "[]") {
            var ofertasIniciais = [
                { 
                    id: 1, 
                    nome: "Hotel Praia Azul", 
                    descricao: "Localização fantástica em frente ao mar, inclui pequeno-almoço.", 
                    precoAntigo: 120, 
                    precoNovo: 85,
                    imagem: "../images/praia.jpg" // Caminho para a imagem na pasta images
                },
                { 
                    id: 2, 
                    nome: "Resort Serra Verde", 
                    descricao: "Desconexão total no meio da natureza com trilhos e bungalows.", 
                    precoAntigo: 180, 
                    precoNovo: 130,
                    imagem: "../images/serra.jpg" // Caminho para a imagem na pasta images
                }
            ];
            localStorage.setItem('ofertas', JSON.stringify(ofertasIniciais));
        }
    }

    function renderizarCatalogo() {
        verificarBancoDeDados(); // Garante que a base de dados local tem as imagens configuradas
        
        var ofertas = JSON.parse(localStorage.getItem('ofertas')) || [];
        var htmlEspaco = document.getElementById('espaco-cards');
        if (!htmlEspaco) return;
        htmlEspaco.innerHTML = '';

        if (ofertas.length === 0) {
            htmlEspaco.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #777;">Nenhuma oferta disponível de momento.</p>';
            return;
        }

        ofertas.forEach(function(o) {
            var htmlPrecos = '';
            if (o.precoAntigo && o.precoAntigo !== o.precoNovo) {
                htmlPrecos += '<span class="preco-antes">Antes: ' + o.precoAntigo + '€</span>';
            }
            htmlPrecos += '<span class="preco-agora">' + o.precoNovo + '€</span>';

            // Se a oferta não tiver imagem definida (por ter sido criada no admin), pomos uma por defeito
            var urlImagem = o.imagem || "../images/logotipo.jpg";

            htmlEspaco.innerHTML += `
                <div class="card-hotel">
                    <img src="${urlImagem}" alt="${o.nome}" style="width: 100%; height: 180px; object-fit: cover; border-radius: 4px; margin-bottom: 15px;">
                    <div>
                        <h3>${o.nome}</h3>
                        <p style="margin-bottom: 15px; color: #555;">${o.descricao || 'Sem descrição disponível.'}</p>
                    </div>
                    <div>
                        <div class="box-precos">${htmlPrecos}</div>
                        <a href="pagamento.html?id=${o.id}" class="btn-ver">Ver Oferta</a>
                    </div>
                </div>`;
        });
    }
    
    window.onload = function() { renderizarCatalogo(); };
</script>
</body>
</html>
