<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador - HS Hotels</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 20px; color: #333; }
        
        header {
            background: white; padding: 15px 30px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;
        }
        .logo-container img { max-width: 150px; height: auto; }
        .nav-links a { color: #ff1e00; text-decoration: none; font-weight: bold; }

        .admin-grid {
            max-width: 1200px; margin: 0 auto;
            display: grid; grid-template-columns: 1fr 1fr; gap: 25px;
        }

        @media (max-width: 768px) { .admin-grid { grid-template-columns: 1fr; } }

        .painel-box {
            background: white; padding: 25px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        h2 { margin-bottom: 20px; font-size: 20px; color: #000; border-bottom: 2px solid #f4f6f9; padding-bottom: 10px;}
        
        .barra-pesquisa-admin {
            width: 100%; padding: 10px; margin-bottom: 15px;
            border: 1px solid #ccc; border-radius: 4px;
        }

        .btn-add {
            background-color: #ff1e00; color: white; border: none; padding: 10px 15px;
            border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 15px;
        }
        .btn-add:hover { background-color: #c00808; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background-color: #f8f9fa; font-weight: bold; }

        .btn-remover {
            background: none; border: none; color: #ff1e00; cursor: pointer; font-weight: bold;
        }
        .btn-remover:hover { text-decoration: underline; }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <img src="Untitled.jpg" alt="Logótipo HS Hotels">
    </div>
    <h2>Olá Administrador</h2>
    <div class="nav-links">
        <a href="catalogo.html">Voltar ao Catálogo</a>
    </div>
</header>

<div class="admin-grid">
    <div class="painel-box">
        <h2>Lista de Utilizadores</h2>
        <input type="text" class="barra-pesquisa-admin" placeholder="Procurar utilizador...">
        <button class="btn-add">+ Adicionar Utilizador</button>
        
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>João Silva</td>
                    <td>joao@email.com</td>
                    <td><button class="btn-remover">Remover</button></td>
                </tr>
                <tr>
                    <td>Maria Santos</td>
                    <td>maria@email.com</td>
                    <td><button class="btn-remover">Remover</button></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="painel-box">
        <h2>Lista de Ofertas (Catálogo)</h2>
        <button class="btn-add">+ Adicionar Nova Oferta</button>
        
        <table>
            <thead>
                <tr>
                    <th>Oferta</th>
                    <th>Preço Atual</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Hotel Praia Azul</td>
                    <td>85€</td>
                    <td><button class="btn-remover">Remover</button></td>
                </tr>
                <tr>
                    <td>Resort Serra Verde</td>
                    <td>130€</td>
                    <td><button class="btn-remover">Remover</button></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
