<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador - HS Hotels</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

<header>
    <div class="logo-container">
        <img src="logotipo.jpg" alt="Logótipo HS Hotels">
    </div>
    <h2>Olá Administrador</h2>
    <div class="nav-links"><a href="catalogo.html">Voltar ao Catálogo</a></div>
</header>

<div class="admin-grid">
    <div class="painel-box">
        <h2>Lista de Utilizadores</h2>
        <button class="btn-add" onclick="adicionarUtilizador()">+ Adicionar Utilizador</button>
        <table>
            <thead><tr><th>Nome</th><th>Email</th><th>Ações</th></tr></thead>
            <tbody id="tabela-utilizadores"></tbody>
        </table>
    </div>

    <div class="painel-box">
        <h2>Lista de Ofertas (Catálogo)</h2>
        <button class="btn-add" onclick="adicionarOferta()">+ Adicionar Nova Oferta</button>
        <table>
            <thead><tr><th>Oferta / Descrição</th><th>Preço</th><th>Ações</th></tr></thead>
            <tbody id="tabela-ofertas"></tbody>
        </table>
    </div>
</div>

<script>
    function verificarBancoDeDados() {
        var ofertasAtuais = localStorage.getItem('ofertas');
        if (!ofertasAtuais || ofertasAtuais === "[]") {
            var ofertasIniciais = [
                { id: 1, nome: "Hotel Praia Azul", descricao: "Localização fantástica em frente ao mar, inclui pequeno-almoço.", precoAntigo: 120, precoNovo: 85 },
                { id: 2, nome: "Resort Serra Verde", descricao: "Desconexão total no meio da natureza com trilhos e bungalows.", precoAntigo: 180, precoNovo: 130 }
            ];
            localStorage.setItem('ofertas', JSON.stringify(ofertasIniciais));
        }
        if (!localStorage.getItem('utilizadores')) {
            var users = [
                { id: 1, nome: "João Silva", email: "joao@email.com" },
                { id: 2, nome: "Maria Santos", email: "maria@email.com" }
            ];
            localStorage.setItem('utilizadores', JSON.stringify(users));
        }
    }

    function carregarDados() {
        verificarBancoDeDados();
        var tUser = document.getElementById('tabela-utilizadores');
        var tOfertas = document.getElementById('tabela-ofertas');
        if (!tUser || !tOfertas) return;

        var users = JSON.parse(localStorage.getItem('utilizadores')) || [];
        tUser.innerHTML = '';
        users.forEach(function(u) {
            tUser.innerHTML += '<tr><td>' + u.nome + '</td><td>' + u.email + '</td><td><button class="btn-remover" onclick="removerUtilizador(' + u.id + ')">Remover</button></td></tr>';
        });

        var ofertas = JSON.parse(localStorage.getItem('ofertas')) || [];
        tOfertas.innerHTML = '';
        ofertas.forEach(function(o) {
            tOfertas.innerHTML += `
                <tr>
                    <td>
                        <strong>${o.nome}</strong>
                        <span class="desc-preview">${o.descricao || 'Sem descrição'}</span>
                    </td>
                    <td>${o.precoNovo}€</td>
                    <td>
                        <button class="btn-remover" onclick="removerOferta(${o.id})">Remover</button>
                        <button class="btn-editar" onclick="editarOferta(${o.id})">Editar</button>
                    </td>
                </tr>`;
        });
    }

    function adicionarUtilizador() {
        var nome = prompt("Nome do utilizador:");
        var email = prompt("Email do utilizador:");
        if(nome && email) {
            var users = JSON.parse(localStorage.getItem('utilizadores')) || [];
            users.push({ id: Date.now(), nome: nome, email: email });
            localStorage.setItem('utilizadores', JSON.stringify(users));
            carregarDados();
        }
    }

    function removerUtilizador(id) {
        var users = JSON.parse(localStorage.getItem('utilizadores')) || [];
        users = users.filter(function(u) { return u.id !== id; });
        localStorage.setItem('utilizadores', JSON.stringify(users));
        carregarDados();
    }

    function adicionarOferta() {
        var nome = prompt("Nome da Oferta/Hotel:");
        var desc = prompt("Descrição:");
        var preco = prompt("Preço Atual (€):");
        if(nome && desc && preco) {
            var ofertas = JSON.parse(localStorage.getItem('ofertas')) || [];
            ofertas.push({ id: Date.now(), nome: nome, descricao: desc, precoAntigo: Number(preco), precoNovo: Number(preco) });
            localStorage.setItem('ofertas', JSON.stringify(ofertas));
            carregarDados();
        }
    }

    function removerOferta(id) {
        var ofertas = JSON.parse(localStorage.getItem('ofertas')) || [];
        ofertas = ofertas.filter(function(o) { return o.id !== id; });
        localStorage.setItem('ofertas', JSON.stringify(ofertas));
        carregarDados();
    }

    function editarOferta(id) {
        var ofertas = JSON.parse(localStorage.getItem('ofertas')) || [];
        var oferta = ofertas.find(function(o) { return o.id === id; });
        if (oferta) {
            var novoNome = prompt("Editar Nome do Hotel:", oferta.nome);
            if (novoNome === null) return; 
            var novaDescricao = prompt("Editar Descrição do Hotel:", oferta.descricao);
            if (novaDescricao === null) return; 
            oferta.nome = novoNome || oferta.nome;
            oferta.descricao = novaDescricao || oferta.descricao;
            localStorage.setItem('ofertas', JSON.stringify(ofertas));
            carregarDados();
        }
    }

    window.onload = function() { carregarDados(); };
</script>
</body>
</html>
