<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento e Detalhes - HS Hotels</title>
    <!-- Leitura da pasta styles/styles.css -->
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>

<div class="container-pagamento">
    <div class="header-pagamento">
        <img src="../images/logotipo.jpg" alt="Logótipo HS Hotels">
        <h2>Resumo da Reserva / Pagamento</h2>
    </div>

    <div class="detalhes-produto" id="detalhes-oferta"></div>

    <div class="seccao-comentarios">
        <h3>Avaliações de Clientes</h3>
        <div id="lista-comentarios"></div>

        <div class="novo-comentario">
            <label style="font-weight: bold;">Deixe a sua avaliação:</label>
            <select id="nota-estrela" style="margin-top: 5px; padding: 5px; width: 120px; display: block;">
                <option value="★★★★★">5 Estrelas</option>
                <option value="★★★★☆">4 Estrelas</option>
                <option value="★★★☆☆">3 Estrelas</option>
                <option value="★★☆☆☆">2 Estrelas</option>
                <option value="★☆☆☆☆">1 Estrela</option>
            </select>
            <textarea id="texto-comentario" placeholder="Escreva aqui o seu comentário..."></textarea>
            <button type="button" class="btn-comentar" onclick="adicionarComentario()">Enviar Comentário</button>
        </div>
    </div>

    <form onsubmit="alert('Pagamento efetuado com sucesso!'); window.location.href='catalogo.php'; return false;">
        <div class="metodos-pagamento">
            <h3>Método de Pagamento</h3>
            <label class="opcao-pagamento"><input type="radio" name="metodo" required> MB WAY</label>
            <label class="opcao-pagamento"><input type="radio" name="metodo"> Cartão de Crédito</label>
        </div>
        <div class="botoes-container">
            <a href="catalogo.php" class="btn-cancelar">Cancelar</a>
            <button type="submit" class="btn-pagar">Pagar Agora</button>
        </div>
    </form>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const idOferta = parseInt(params.get('id')) || 1;
    const ofertas = JSON.parse(localStorage.getItem('ofertas')) || [];
    const ofertaSelecionada = ofertas.find(o => o.id === idOferta) || ofertas[0];

    if (ofertaSelecionada) {
        document.getElementById('detalhes-oferta').innerHTML = `
            <h3>${ofertaSelecionada.nome}</h3>
            <p>${ofertaSelecionada.descricao || 'Sem descrição disponível.'}</p>
            <div class="preco-final">Preço a pagar: ${ofertaSelecionada.precoNovo}€</div>
        `;
    }

    const chaveComentários = `comentarios_${idOferta}`;
    if (!localStorage.getItem(chaveComentários)) {
        localStorage.setItem(chaveComentários, JSON.stringify([
            { estrelas: "★★★★★", texto: "Excelente atendimento e muito cómodo." }
        ]));
    }

    function carregarComentarios() {
        const coms = JSON.parse(localStorage.getItem(chaveComentários)) || [];
        const box = document.getElementById('lista-comentarios');
        if(!box) return;
        box.innerHTML = '';
        coms.forEach(c => {
            box.innerHTML += `<div class="comentario-item"><div class="estrelas">${c.estrelas}</div><p>${c.texto}</p></div>`;
        });
    }

    function adicionarComentario() {
        const texto = document.getElementById('texto-comentario').value;
        const estrelas = document.getElementById('nota-estrela').value;
        if(texto.trim() !== '') {
            const coms = JSON.parse(localStorage.getItem(chaveComentários)) || [];
            coms.push({ estrelas, texto });
            localStorage.setItem(chaveComentários, JSON.stringify(coms));
            document.getElementById('texto-comentario').value = '';
            carregarComentarios();
        }
    }
    window.onload = function() { carregarComentarios(); };
</script>
</body>
</html>
